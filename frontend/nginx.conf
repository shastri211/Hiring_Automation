server {
    listen 80;
    root /usr/share/nginx/html;

    # Matches the backend's own caps: a ZIP upload may be up to
    # MAX_RESUME_FILE_SIZE_MB x MAX_RESUMES_PER_UPLOAD (15 MB x 200 by default).
    client_max_body_size 3100m;

    # Same-origin API: the session cookie needs no CORS. The "/api" prefix is
    # stripped, as in the Vite dev proxy.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Job creation profiles the JD with an LLM in-request, and large
        # uploads take time to stream.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Content-hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (e.g. /jobs/12, /apply/<token>) all serve the app.
    location / {
        try_files $uri /index.html;
    }
}
