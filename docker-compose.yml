services:
  postgres:
    # Same major version as the data it was migrated from (PostgreSQL 16).
    image: postgres:16-alpine
    environment:
      # Password is sourced from the project-root .env (see .env.example);
      # Docker Compose auto-loads it for ${VAR} interpolation.
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resume_screener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

# Vectors live in Qdrant Cloud (QDRANT_URL / QDRANT_API_KEY in .env) - there
# is no local Qdrant service.

volumes:
  postgres_data:
  redis_data:
